[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-assistant"
version = "0.1.2"
description = "Local, single-account shopping assistant with a JD adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "websockets==17.3",
  "playwright==1.64.1",
  "pydantic==2.14.1",
  "httpx==0.28.1",
  "tzdata==2026.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
